<div id="codex-usage-pet-panel">
  <div class="cup-heading"><div><strong>Codex 用量</strong><div class="cup-caption" data-role="stamp"></div></div><button class="btn btn-ghost" type="button" data-role="settings" aria-label="设置平台和模型价格"><i data-lucide="settings" aria-hidden="true"></i> 设置</button></div>
  <div class="cup-caption" data-role="demo" hidden>模拟数据 · 界面演示</div>
  <div class="viz-controls"><label class="form-label">平台 <select class="form-select" data-role="platform" aria-label="统计平台"></select></label></div>
  <div class="viz-grid cup-metrics">
    <div class="card viz-stat"><span>今日 Token</span><div class="viz-stat-value" data-role="today">—</div><div class="cup-caption" data-role="today-cost"></div></div>
    <div class="card viz-stat"><span>累计 Token</span><div class="viz-stat-value" data-role="total">—</div><div class="cup-caption" data-role="total-cost"></div></div>
  </div>
  <div class="viz-grid" data-role="balances"></div>
  <div class="viz-controls cup-chart-controls"><button class="btn btn-primary" type="button" data-mode="tokens" aria-pressed="true">Token</button><button class="btn" type="button" data-mode="cost" aria-pressed="false">费用估算</button><label class="form-label" data-role="currency-label" hidden>单位 <select class="form-select" data-role="currency" aria-label="费用单位"></select></label><button class="btn btn-ghost" type="button" data-role="view" aria-pressed="false">模型汇总</button></div>
  <div class="cup-chart" data-role="chart-area"><div class="cup-caption" data-role="axis-label"></div><svg class="cup-plot" data-role="chart" role="img" aria-label="最近七天按模型堆叠的用量图"></svg><div class="cup-tooltip" data-role="tooltip" role="tooltip" hidden></div></div>
  <div class="viz-row cup-legend" data-role="legend"></div>
  <div class="table-responsive"><table class="table table-sm" data-role="models" hidden><thead><tr><th>模型</th><th class="text-end">Token</th><th class="text-end">估算费用</th></tr></thead><tbody></tbody></table></div>
  <details class="cup-notes"><summary>统计范围与状态</summary><ul data-role="warnings"></ul></details>
</div>
<style>
#codex-usage-pet-panel{position:relative;color:var(--foreground);font-family:inherit;line-height:1.5;font-variant-numeric:tabular-nums}
#codex-usage-pet-panel .cup-heading{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:4px 92px 16px 0}
#codex-usage-pet-panel .cup-heading strong{font-size:18px;font-weight:650}
#codex-usage-pet-panel .cup-caption{color:var(--muted-foreground);font-size:12px;overflow-wrap:anywhere}
#codex-usage-pet-panel .cup-metrics{margin:12px 0}
#codex-usage-pet-panel .cup-chart-controls{margin:20px 0 8px}
#codex-usage-pet-panel .cup-chart{position:relative;min-width:0}
#codex-usage-pet-panel .cup-plot{display:block;width:100%;height:212px;overflow:visible}
#codex-usage-pet-panel .cup-plot text{fill:var(--muted-foreground);font-family:inherit;font-size:11px}
#codex-usage-pet-panel .cup-plot .cup-grid{stroke:var(--border);stroke-width:1}
#codex-usage-pet-panel .cup-tooltip{position:absolute;z-index:3;pointer-events:none;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11px;width:max-content;max-width:min(220px,85%);box-shadow:0 4px 16px rgb(0 0 0 / 12%)}
#codex-usage-pet-panel .cup-tooltip[hidden]{display:none}
#codex-usage-pet-panel .cup-tip-row{display:flex;justify-content:space-between;gap:12px;overflow-wrap:anywhere}
#codex-usage-pet-panel .cup-tip-row span:first-child{min-width:0}
#codex-usage-pet-panel .cup-tip-row span:last-child{white-space:nowrap}
#codex-usage-pet-panel .cup-legend{margin:8px 0;font-size:12px;color:var(--muted-foreground)}
#codex-usage-pet-panel .cup-swatch{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px}
#codex-usage-pet-panel .cup-notes{margin-top:18px;font-size:12px;color:var(--muted-foreground)}
#codex-usage-pet-panel .cup-notes ul{padding-left:18px;margin:6px 0}
#codex-usage-pet-panel .cup-empty{font-size:12px;color:var(--muted-foreground)}
@media(max-width:420px){#codex-usage-pet-panel .cup-heading{padding-right:0;align-items:flex-start}#codex-usage-pet-panel .cup-plot{height:200px}}
</style>
<script>
(() => {
  const root = document.getElementById('codex-usage-pet-panel');
  const data = __USAGE_DATA__;
  const get = name => root.querySelector(`[data-role="${name}"]`);
  const state = {platform:'all',mode:'tokens',view:'days',currency:''};
  const number = n => n >= 1000000 ? (n/1000000).toFixed(2).replace(/\.?0+$/,'')+'M' : Math.round(n).toLocaleString('en-US');
  const money = n => Number(n).toFixed(2);
  const allModels = [...new Set(data.records.map(r=>r.model))].sort();
  const color = model => `var(--viz-series-${(allModels.indexOf(model)%6)+1})`;
  const node = (tag,text,className) => {const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e;};
  const records = () => data.records.filter(r=>state.platform==='all'||(r.platform_id||'unknown')===state.platform);
  const totals = rows => rows.reduce((n,r)=>n+r.total_tokens,0);
  const costText = rows => {
    if(!rows.length) return '费用估算 0.00';
    const groups = new Map(); let unknown=0;
    rows.forEach(r=>{if(!r.cost){unknown++;return;}groups.set(r.cost.unit,(groups.get(r.cost.unit)||0)+Number(r.cost.amount));});
    if(unknown) return '费用未配置 · '+unknown+' 条记录';
    if(groups.size>1)return '多种费用单位 · 请按平台查看';
    return '费用估算 '+[...groups.values()].map(money).join(' / ');
  };
  const platforms = new Map(data.balances.map(p=>[p.id,p.name]));
  data.records.forEach(r=>platforms.set(r.platform_id||'unknown',r.platform_name));
  get('platform').append(new Option('全部平台','all'));
  platforms.forEach((name,id)=>get('platform').append(new Option(name,id)));
  get('stamp').textContent='本次查询 '+data.generated_at.replace('T',' ').slice(0,19);
  get('demo').hidden=!data.demo;
  const feeUnits=[...new Set(data.records.filter(r=>r.cost).map(r=>r.cost.unit))];
  const balanceUnits=data.balances.filter(p=>p.unit).map(p=>p.name+'：'+p.unit);
  const balanceTimes=data.balances.filter(p=>p.success_at).map(p=>p.name+' 余额最后成功查询：'+p.success_at.replace('T',' '));
  const warnings=[...data.warnings,'费用按配置价格估算，平台余额包含其他应用的消费。',...(feeUnits.length?['费用单位：'+feeUnits.join('、')+'；不同单位不合计。']:[]),...(balanceUnits.length?['余额单位：'+balanceUnits.join('；')]:[]),...balanceTimes,'会话未保留历史认证方式；Token 按桌面端来源统计，不推断过往登录方式。'];
  warnings.forEach(text=>get('warnings').append(node('li',text)));
  if(window.openai?.sendFollowUpMessage){get('settings').onclick=async()=>{try{await window.openai.sendFollowUpMessage({prompt:'使用 $codex-usage 帮我配置平台余额接口和模型价格，不在对话中索取完整密钥。',title:'配置用量宠物'});}catch{get('settings').textContent='请在对话中配置';}};}
  else {get('settings').disabled=true;get('settings').setAttribute('data-tooltip','在对话中说：配置用量宠物');}
  const showBalances=()=>{
    const area=get('balances');area.replaceChildren();
    const balances=data.balances.filter(p=>state.platform==='all'||p.id===state.platform);
    if(!balances.length){area.append(node('div','平台余额未配置','cup-empty'));return;}
    balances.forEach(p=>{
      const card=node('div',undefined,'card viz-stat');
      card.append(node('span',p.name+' · 账号余额'));
      card.append(node('div',p.amount!==undefined?money(p.amount):'—','viz-stat-value'));
      const caption=p.state==='stale'?'旧余额 · '+p.message:p.message||p.note;
      card.append(node('div',caption,'cup-caption'));
      const spending=(data.daily_spending||[]).find(s=>s.id===p.id);
      if(spending){
        const valid=spending.day===data.today&&spending.amount!==undefined;
        card.append(node('div','账号今日消费 '+(valid?money(spending.amount)+(spending.state==='stale'?'（旧）':''):'—'),'cup-caption'));
        card.append(node('div','包含其他软件调用'+(spending.message?' · '+spending.message:''),'cup-caption'));
      }
      if(p.state==='stale'||p.state==='error')card.setAttribute('role','status');
      area.append(card);
    });
  };
  const svgNode=(tag,attrs,text)=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,v));if(text!==undefined)n.textContent=text;return n;};
  const recentDays=()=>{const end=new Date(data.today+'T12:00:00Z');return Array.from({length:7},(_,i)=>new Date(end.getTime()-(6-i)*86400000).toISOString().slice(0,10));};
  const draw=()=>{
    const rows=records(), today=rows.filter(r=>r.day===data.today);
    get('today').textContent=number(totals(today));get('total').textContent=number(totals(rows));
    get('today-cost').textContent=costText(today);get('total-cost').textContent=costText(rows);showBalances();
    const units=[...new Set(rows.filter(r=>r.cost).map(r=>r.cost.unit))].sort();
    if(!units.includes(state.currency))state.currency=units[0]||'';
    get('currency').replaceChildren(...units.map(unit=>new Option(unit,unit,false,unit===state.currency)));
    get('currency-label').hidden=state.mode!=='cost'||units.length<2;
    get('axis-label').textContent=state.mode==='tokens'?'最近七天 · Token':'最近七天 · 费用估算'+(state.currency?'':' · 未配置价格');
    get('tooltip').hidden=true;
    const modelMap=new Map();rows.forEach(r=>{const list=modelMap.get(r.model)||[];list.push(r);modelMap.set(r.model,list);});
    const table=get('models');table.hidden=state.view!=='models';get('chart-area').hidden=state.view==='models';get('legend').hidden=state.view==='models';
    const tbody=table.querySelector('tbody');tbody.replaceChildren();
    [...modelMap].sort((a,b)=>totals(b[1])-totals(a[1])).forEach(([name,list])=>{
      if(!totals(list))return;
      const tr=node('tr');tr.append(node('td',name));tr.append(node('td',number(totals(list)),'text-end'));
      tr.append(node('td',costText(list).replace(/^费用估算 /,''),'text-end'));tbody.append(tr);
    });
    if(state.view==='models')return;
    const days=recentDays(), groups=days.map(day=>{
      const rowsDay=rows.filter(r=>r.day===day),values=new Map();
      rowsDay.forEach(r=>{const value=state.mode==='tokens'?r.total_tokens:r.cost&&r.cost.unit===state.currency?Number(r.cost.amount):0;if(value>0)values.set(r.model,(values.get(r.model)||0)+value);});
      return {day,values,unknown:state.mode==='cost'&&rowsDay.some(r=>!r.cost)};
    });
    const svg=get('chart'), width=Math.max(240,get('chart-area').clientWidth||600), height=212,left=62,right=12,top=14,bottom=33;
    svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.replaceChildren();svg.append(svgNode('title',{},'最近七天，按模型堆叠的'+(state.mode==='tokens'?'Token':'费用估算')));
    const max=Math.max(0,...groups.map(g=>[...g.values.values()].reduce((n,v)=>n+v,0))),scaleMax=max>0?max*1.1:1,plotHeight=height-top-bottom;
    for(let i=0;i<3;i++){const value=scaleMax*i/2,y=height-bottom-plotHeight*i/2;svg.append(svgNode('line',{x1:left,x2:width-right,y1:y,y2:y,class:'cup-grid'}));svg.append(svgNode('text',{x:left-8,y:y+4,'text-anchor':'end'},state.mode==='tokens'?number(value):money(value)));}
    const step=(width-left-right)/7,barWidth=Math.min(30,step*.58);
    const legend=new Set();
    groups.forEach((g,i)=>{
      const x=left+step*(i+.5);let y=height-bottom;
      [...g.values].sort((a,b)=>allModels.indexOf(a[0])-allModels.indexOf(b[0])).forEach(([model,value])=>{
        legend.add(model);const h=value/scaleMax*plotHeight;y-=h;
        svg.append(svgNode('rect',{x:x-barWidth/2,y,width:barWidth,height:h,fill:color(model),rx:1}));
      });
      if(width>420||i%2===0)svg.append(svgNode('text',{x,y:height-10,'text-anchor':'middle'},g.day.slice(5).replace('-','/')));
      if(g.unknown)svg.append(svgNode('text',{x,y:Math.max(11,y-5),'text-anchor':'middle'},'?'));
      const hit=svgNode('rect',{x:x-step/2+1,y:top,width:step-2,height:plotHeight,fill:'transparent',class:'cursor-interaction'});
      const tipText=[g.day,...[...g.values].map(([m,v])=>m+' '+(state.mode==='tokens'?number(v):money(v))),...(g.unknown?['存在未配置费用']:[])].join('；');
      hit.setAttribute('aria-label',tipText);
      const show=()=>{
        const tip=get('tooltip');tip.replaceChildren(node('strong',g.day));
        [...g.values].sort((a,b)=>b[1]-a[1]).forEach(([m,v])=>{const row=node('div',undefined,'cup-tip-row');const label=node('span');const swatch=node('span',undefined,'cup-swatch');swatch.style.background=color(m);label.append(swatch,document.createTextNode(m));row.append(label,node('span',state.mode==='tokens'?number(v):money(v)));tip.append(row);});
        if(!g.values.size)tip.append(node('div',g.unknown?'费用未配置':'无用量'));
        if(g.unknown&&g.values.size)tip.append(node('div','仅显示已配置费用；总费用未知'));
        tip.hidden=false;tip.style.left=Math.max(4,Math.min(width-tip.offsetWidth-4,x-tip.offsetWidth/2))+'px';tip.style.top='26px';
      };
      hit.onpointerenter=e=>{if(e.pointerType==='mouse')show();};hit.onpointerleave=e=>{if(e.pointerType==='mouse')get('tooltip').hidden=true;};hit.onclick=()=>{if(get('tooltip').hidden)show();else get('tooltip').hidden=true;};
      svg.append(hit);
    });
    const legendArea=get('legend');legendArea.replaceChildren();[...legend].sort().forEach(model=>{const label=node('span');const dot=node('span',undefined,'cup-swatch');dot.style.background=color(model);label.append(dot,document.createTextNode(model));legendArea.append(label);});
  };
  get('platform').onchange=e=>{state.platform=e.target.value;draw();};get('currency').onchange=e=>{state.currency=e.target.value;draw();};
  root.querySelectorAll('[data-mode]').forEach(button=>{button.onclick=()=>{state.mode=button.dataset.mode;root.querySelectorAll('[data-mode]').forEach(b=>{const active=b===button;b.classList.toggle('btn-primary',active);b.setAttribute('aria-pressed',String(active));});draw();};});
  get('view').onclick=()=>{state.view=state.view==='days'?'models':'days';get('view').textContent=state.view==='models'?'日期趋势':'模型汇总';get('view').setAttribute('aria-pressed',String(state.view==='models'));draw();};
  new ResizeObserver(draw).observe(root);draw();
})();
</script>
